{# docs/_templates/layout.html #}
{% extends "!layout.html" %}

{% block extrahead %}
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem("pns-theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
{% endblock %}
